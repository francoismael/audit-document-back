spring.application.name=audit-document
spring.datasource.url=jdbc:postgresql://localhost:5432/audit_document
spring.datasource.username=postgres
spring.datasource.password=franco

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.templates-dir=storage/templates
app.storage.generated-dir=storage/generated

# PDF conversion engine: word (Microsoft Word, exactly the layout of Word; Windows with Word installed)
# or libreoffice (any system, layout a little different from Word).
app.pdf.engine=word
app.pdf.timeout-seconds=120

# Word engine: PowerShell drives Word.
app.pdf.powershell-path=powershell.exe

# LibreOffice engine (headless). On Linux the command is usually /usr/bin/soffice.
app.pdf.soffice-path=C:/Program Files/LibreOffice/program/soffice.com
app.pdf.profile-dir=storage/libreoffice-profile
